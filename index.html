<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GuideLabo｜ゲーム攻略まとめ</title>
<meta name="description" content="複数のゲームの攻略情報をまとめるハブサイト「GuideLabo」。" />
<meta property="og:type" content="website" />
<meta property="og:title" content="GuideLabo｜ゲーム攻略まとめ" />
<meta property="og:description" content="複数のゲームの攻略情報をまとめるハブサイト「GuideLabo」。" />
<meta property="og:image" content="https://guidelabo.com/holo_pokajan/images/og-image.jpg" />
<meta property="og:url" content="https://guidelabo.com/" />
<meta property="og:site_name" content="GuideLabo" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>" />
<style>
  :root {
    --bg: #fff8fb;
    --bg-card: #ffffff;
    --border-soft: #f6e6f1;
    --text-primary: #4a3b5c;
    --text-secondary: #7c6690;
    --text-muted: #a899bb;
    --accent-purple: #c4b5fd;
    --accent-pink: #f9a8d4;
    --accent-purple-strong: #8b5cf6;
    --radius-lg: 22px;
    --font-sans: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font-sans);
    line-height: 1.75;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 64px 20px 48px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 1.1rem;
    margin-bottom: 40px;
  }
  .brand-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--accent-pink), var(--accent-purple));
    font-size: 1.1rem;
  }
  h1 {
    font-size: clamp(1.6rem, 5vw, 2.3rem);
    font-weight: 900;
    margin: 0 0 12px;
  }
  p.lead {
    color: var(--text-secondary);
    max-width: 52ch;
    margin: 0 0 36px;
  }
  .games {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .game-card {
    display: block;
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-lg);
    padding: 22px 24px;
    text-decoration: none;
    color: var(--text-primary);
    box-shadow: 0 4px 18px rgba(196, 158, 197, 0.16);
    transition: transform 0.15s ease;
  }
  .game-card:hover { transform: translateY(-3px); }
  .game-card h2 {
    margin: 0 0 6px;
    font-size: 1.15rem;
  }
  .game-card p {
    margin: 0;
    color: var(--text-secondary);
    font-size: 0.92rem;
  }
  .game-card.soon {
    opacity: 0.6;
    pointer-events: none;
  }
  footer {
    margin-top: 48px;
    font-size: 0.78rem;
    color: var(--text-muted);
  }
  a { color: var(--accent-purple-strong); }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <span class="brand-mark">🎮</span>
    <span>GuideLabo</span>
  </div>

  <h1>ゲーム攻略まとめサイト</h1>
  <p class="lead">複数のゲームの攻略情報をひとつにまとめていくハブサイトです。まずは「ポカジャン」から公開しています。</p>

  <div class="games">
    <a class="game-card" href="/holo_pokajan/">
      <h2>🃏 ポカジャン攻略Lab</h2>
      <p>ホロライブドリームス（ホロドリ）のミニゲーム「ポカジャン」に特化した攻略サイト。ルール・役一覧・戦術まで完全網羅。</p>
    </a>
    <div class="game-card soon">
      <h2>🚧 準備中</h2>
      <p>他のゲームの攻略コンテンツも順次追加予定です。</p>
    </div>
  </div>

  <div id="ad-inline-hub" style="margin-top:24px;"></div>

  <footer>© 2026 GuideLabo</footer>
</div>

<div id="ad-fixed-hub"></div>
<script>
  if (window.innerWidth < 768) {
    var s = document.createElement("script");
    s.src = "https://adm.shinobi.jp/s/53424dc3792c66e8c524dbb14efe6b9a";
    document.getElementById("ad-fixed-hub").appendChild(s);
  } else {
    var s2 = document.createElement("script");
    s2.src = "https://adm.shinobi.jp/s/65c7d77707083429e7a6757025c9b1c0";
    document.getElementById("ad-inline-hub").appendChild(s2);
  }
</script>
</body>
</html>
