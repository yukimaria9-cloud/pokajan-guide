<style>
  :root {
    --bg: #fff8fb;
    --bg-card: #ffffff;
    --border-soft: #f6e6f1;
    --text-primary: #4a3b5c;
    --text-secondary: #7c6690;
    --text-muted: #a899bb;
    --accent-purple: #c4b5fd;
    --accent-pink: #f9a8d4;
    --accent-purple-strong: #8b5cf6;
    --radius-lg: 22px;
    --font-sans: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font-sans);
    line-height: 1.75;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 64px 20px 48px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 1.1rem;
    margin-bottom: 40px;
  }
  .brand-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--accent-pink), var(--accent-purple));
    font-size: 1.1rem;
  }
  h1 {
    font-size: clamp(1.6rem, 5vw, 2.3rem);
    font-weight: 900;
    margin: 0 0 12px;
  }
  p.lead {
    color: var(--text-secondary);
    max-width: 52ch;
    margin: 0 0 36px;
  }
  .games {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .game-card {
    display: block;
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-lg);
    padding: 22px 24px;
    text-decoration: none;
    color: var(--text-primary);
    box-shadow: 0 4px 18px rgba(196, 158, 197, 0.16);
    transition: transform 0.15s ease;
  }
  .game-card:hover { transform: translateY(-3px); }
  .game-card h2 {
    margin: 0 0 6px;
    font-size: 1.15rem;
  }
  .game-card p {
    margin: 0;
    color: var(--text-secondary);
    font-size: 0.92rem;
  }
  .game-card.soon {
    opacity: 0.6;
    pointer-events: none;
  }
  footer {
    margin-top: 48px;
    font-size: 0.78rem;
    color: var(--text-muted);
  }
  a { color: var(--accent-purple-strong); }
  .ad-pc-only { display: block; }
  .ad-sp-only { display: none; }
  @media (max-width: 767px) {
    .ad-pc-only { display: none; }
    .ad-sp-only { display: block; }
  }
  #ad-inline-hub img, #ad-fixed-hub img { max-width: 100%; height: auto; }
  @media (min-width: 768px) {
    #ad-fixed-hub {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 999;
      max-width: 300px;
      background: #fff;
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
    }
  }
</style>

<div class="wrap">

  <h1>ゲーム攻略まとめサイト</h1>
  <p class="lead">複数のゲームの攻略情報をひとつにまとめていくハブサイトです。まずは「ポカジャン」から公開しています。</p>

  <div class="games">
    <a class="game-card" href="/holo_pokajan/">
      <h2>🃏 ポカジャン攻略Lab</h2>
      <p>ホロライブドリームス（ホロドリ）のミニゲーム「ポカジャン」に特化した攻略サイト。ルール・役一覧・戦術に加え、実装楽曲の再生数分析なども掲載。</p>
    </a>
    <div class="game-card soon">
      <h2>🚧 準備中</h2>
      <p>他のゲームの攻略コンテンツも順次追加予定です。</p>
    </div>
  </div>

  <div id="ad-inline-hub" style="margin-top:24px;">
    <div class="ad-pc-only" data-ad-slot="pc-inline"></div>
    <div class="ad-sp-only" data-ad-slot="sp-inline"></div>
  </div>

  <footer>

  </footer>
</div>
